<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>관리자 · 도봉 아테라 단지 내 상가</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="admin.css">

<body>
<div class="login" id="login">
  <form class="login-card" id="loginForm">
    <div class="lg-brand"><svg viewBox="0 0 40 26"><path d="M20 0 40 14v12H28V18l-8-6-8 6v8H0V14z" fill="currentColor"/></svg><div><b>ARTERA</b><span>도봉 아테라 상가 관리자</span></div></div>
    <label>아이디<input name="id" value="" autocomplete="username" placeholder="artera"></label>
    <label>비밀번호<input name="pw" type="password" autocomplete="current-password" placeholder="demo1234"></label>
    <button class="btn btn-o">로그인</button>
    <p class="hint">시안용 계정 : artera / demo1234</p>
    <p class="err" id="loginErr"></p>
  </form>
</div>
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="side-brand"><svg viewBox="0 0 40 26"><path d="M20 0 40 14v12H28V18l-8-6-8 6v8H0V14z" fill="currentColor"/></svg><div><b>ARTERA</b><span>상가 관리자</span></div></div>
    <nav class="side-nav">
      <a href="#dash" data-nav="dash"><i>▦</i>대시보드</a>
      <a href="#funnel" data-nav="funnel"><i>◔</i>방문 분석</a>
      <a href="#units" data-nav="units"><i>▤</i>호실 관리<em data-badge="units"></em></a>
      <a href="#popup" data-nav="popup"><i>◰</i>팝업 관리</a>
      <a href="#news" data-nav="news"><i>✎</i>소식 · 보도자료</a>
      <a href="#inq" data-nav="inq"><i>✉</i>문의 접수<em data-badge="inq"></em></a>
      <a href="#aeo" data-nav="aeo"><i>◎</i>AI 검색 점검</a>
      <a href="#texts" data-nav="texts"><i>✎</i>문구 수정<em data-badge="texts"></em></a>
      <a href="#site" data-nav="site"><i>⚙</i>사업 정보</a>
    </nav>
    <div class="side-foot">
      <a href="../" target="_blank" class="btn btn-line btn-block">홈페이지 보기 ↗</a>
      <button class="link" id="reset">시안 데이터 초기화</button>
      <button class="link" id="logout">로그아웃</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar"><h1 id="pageTitle">대시보드</h1><div class="topbar-r"><span class="saved" id="saved">저장됨</span><span class="who">운영자 · 분양대행사</span></div></header>
    <div class="view" id="view"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="../assets/data.js"></script>
<script src="funnel.js"></script>
